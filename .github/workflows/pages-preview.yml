name: pages-preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-preview-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate production source
        run: npm run typecheck

      - name: Prepare static preview projection
        run: node scripts/prepare-pages-preview.mjs

      - name: Build static Pages preview
        run: npm run build
        env:
          RFXCHANGE_PAGES_PREVIEW: "1"
          PAGES_BASE_PATH: "/${{ github.event.repository.name }}"
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy-preview:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
