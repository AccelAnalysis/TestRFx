name: pages-preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-preview-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate production source
        run: npm run typecheck

      - name: Resolve preview base path
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            preview_path="pr-${{ github.event.pull_request.number }}"
            base_path="/${{ github.event.repository.name }}/${preview_path}"
          else
            preview_path=""
            base_path="/${{ github.event.repository.name }}"
          fi

          echo "RFX_PREVIEW_PATH=${preview_path}" >> "$GITHUB_ENV"
          echo "PAGES_BASE_PATH=${base_path}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=${base_path}" >> "$GITHUB_ENV"

      - name: Prepare static preview projection
        run: |
          node scripts/prepare-pages-preview.mjs
          node scripts/prepare-onboarding-detail-preview.mjs
          node scripts/prepare-membership-preview.mjs

      - name: Build static Pages preview
        run: npm run build
        env:
          RFXCHANGE_PAGES_PREVIEW: "1"
          PAGES_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-site
          path: ./out
          if-no-files-found: error
          retention-days: 7

      - name: Record preview target
        shell: bash
        run: |
          root="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [[ -n "${RFX_PREVIEW_PATH}" ]]; then
            echo "### Visual preview target" >> "$GITHUB_STEP_SUMMARY"
            echo "${root}/${RFX_PREVIEW_PATH}/exchange/rfx/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Main Pages target" >> "$GITHUB_STEP_SUMMARY"
            echo "${root}/" >> "$GITHUB_STEP_SUMMARY"
          fi
